# 🐳 Docker Compose — Akami K-Beauty (Staging)
# Servicio expuesto en puerto 23000 con tag :staging

services:
  web_akami:
    image: juaneliezer13/akamikbeauty:staging
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "${PORT:-23000}:80"
    volumes:
      - ./uploads:/usr/share/nginx/uploads:ro
    environment:
      - TZ=America/Caracas
    depends_on:
      - api_akami
    networks:
      - akami_network

  api_akami:
    image: juaneliezer13/akami-api:staging
    container_name: api_akami
    restart: unless-stopped
    volumes:
      - ./database:/var/www/database
      - ./uploads:/var/www/uploads
    environment:
      - TZ=America/Caracas
      - UPLOAD_DIR=/var/www/uploads/products
      - DB_PATH=/var/www/database/akami.sqlite
    networks:
      - akami_network

networks:
  akami_network:
    driver: bridge
