# 🐳 Docker Compose — Akami Web (Servidor AWS / Producción)
# Frontend SPA Nginx en puerto 16001

services:
  web_akami:
    image: juaneliezer13/akamikbeauty:latest
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-16001}:80"
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/usr/share/nginx/uploads:ro
    environment:
      - TZ=America/Caracas
    networks:
      - akami_network

networks:
  akami_network:
    name: akami_network
    driver: bridge
