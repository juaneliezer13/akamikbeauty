# 🐳 Docker Compose para Servidor (Staging / VPS)
# Akami K-Beauty — Web SPA expuesta en puerto 23000

services:
  web_akami:
    image: nginx:alpine
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "${PORT:-23000}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=America/Caracas
