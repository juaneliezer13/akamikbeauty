# 🐳 Respaldo Oficial de Docker Compose para el Servidor de Producción (GoDaddy / VPS)
# Akami K-Beauty — Web SPA

services:
  web_akami:
    image: nginx:alpine
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=America/Caracas
