server {
    listen 80 default_server;
    server_name akami.batdev.lat batdev.lat localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 10M;

    # Gzip para carga ultra-rápida en móviles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/otf font/ttf;

    # Proxy para API RESTful en PHP
    location /api/ {
        proxy_pass http://api_akami:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Almacenamiento dinámico de archivos (desacoplado de la imagen)
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Redirección de compatibilidad para enlaces antiguos (/akami -> /)
    location = /akami {
        return 301 /;
    }

    location = /akami/ {
        return 301 /;
    }

    location /akami/ {
        rewrite ^/akami/(.*)$ /$1 permanent;
    }

    # Caché optimizada para assets estáticos empaquetados (CSS, JS, fuentes)
    location ~* \.(?:css|js|woff|woff2|otf|ttf|svg|ico)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Servir Akami K-Beauty directamente en la raíz del subdominio (https://akami.batdev.lat/)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
