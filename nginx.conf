server {
    listen 80 default_server;
    server_name akami.batdev.lat batdev.lat localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip para carga ultra-rápida en móviles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/otf font/ttf;

    # Servir Akami K-Beauty directamente en la raíz del subdominio (https://akami.batdev.lat/)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirección de compatibilidad para enlaces antiguos (/akami -> /)
    location = /akami {
        return 301 /;
    }

    location = /akami/ {
        return 301 /;
    }

    location /akami/ {
        rewrite ^/akami/(.*)$ /$1 permanent;
    }

    # Caché optimizada para assets estáticos (CSS, JS, imágenes, fuentes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|webp|htc|woff|woff2|otf|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
