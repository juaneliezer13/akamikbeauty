# 🐳 Docker Compose — Akami K-Beauty (Staging / Producción)
# Servicio expuesto en puerto 23000 (configurable via variable PORT)

services:
  web_akami:
    build:
      context: .
      dockerfile: Dockerfile
    image: juaneliezer13/akamikbeauty:latest
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "${PORT:-23000}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=America/Caracas
