# 🐳 Docker Compose — Akami Web (Frontend SPA + Nginx)
# Expone la aplicación web en el puerto 16001 (configurable via FRONT_PORT)

services:
  web_akami:
    build:
      context: .
      dockerfile: Dockerfile
    image: juaneliezer13/akamikbeauty:latest
    container_name: cliente_akami
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-16001}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ${UPLOADS_DIR:-../uploads}:/usr/share/nginx/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=America/Caracas
    networks:
      - akami_network

networks:
  akami_network:
    name: akami_network
    driver: bridge
