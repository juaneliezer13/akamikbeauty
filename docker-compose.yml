services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: juaneliezer13/akamikbeauty:latest
    container_name: akamikbeauty
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
